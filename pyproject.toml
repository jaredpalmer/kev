[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kev"
version = "0.1.0"
description = "Laptop-scale reconstruction of a Jev-style decision model with a TypeSafe-compatible /v1/systemone API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jared Palmer" }]
requires-python = ">=3.12"
keywords = ["decision-model", "calibration", "lora", "typesafe", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=3.0",
    "numpy>=2.5.3",
    "peft>=0.21",
    "pydantic>=2.9",
    "scikit-learn>=1.9.1",
    "torch>=2.6,<2.9",
    "transformers>=5.17,<6",
]

[project.urls]
Repository = "https://github.com/jaredpalmer/kev"
Issues = "https://github.com/jaredpalmer/kev/issues"
"Model cards" = "https://github.com/jaredpalmer/kev/tree/main/docs/model-cards"

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "typesafe-sdk>=0.6.0",
    "uvicorn>=0.30",
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",   # the Apple Silicon backend (kev.mlx_model); a no-op elsewhere
]
mlx = [
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.9",
    "modal==1.5.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["server: needs a running kev.serve instance (KEV_BASE_URL)"]

[tool.setuptools]
packages = ["kev"]
