[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kev*"]

[project]
name = "kev"
version = "0.1.0"
description = "Laptop-scale reconstruction of a Jev-style decision model with a TypeSafe-compatible /v1/systemone API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jared Palmer" }]
requires-python = ">=3.12"
keywords = ["decision-model", "calibration", "lora", "typesafe", "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=3.0",
    "numpy>=2.5.3",
    "peft>=0.15",
    "pydantic>=2.9",
    "scikit-learn>=1.9.1",
    "torch>=2.6,<2.9",
    "transformers>=4.51,<4.58",
]

[project.urls]
Repository = "https://github.com/jaredpalmer/kev"
Issues = "https://github.com/jaredpalmer/kev/issues"
"Model card" = "https://github.com/jaredpalmer/kev/blob/main/MODEL_CARD.md"

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "typesafe-sdk>=0.6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.9",
    "modal==1.5.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["server: needs a running kev.serve instance (KEV_BASE_URL)"]
